  translocated: يقوم macOS بتشغيل هذا التطبيق من مسار App Translocation مؤقت. في Finder، انقله يدوياً إلى /Applications أو ~/Applications ثم أعد فتحه.
  rejected: |-
    يجب تشغيل هذا التطبيق من مجلد Applications.

    {reason}
  notInBundle: الملف التنفيذي ليس داخل حزمة التطبيق.
  canonicalizeBundleError: 'تعذر حل مسار حزمة التطبيق: {error}'
  bundleNameError: تعذر تحديد اسم حزمة التطبيق. سيتم إنهاء التطبيق.
  replacePrompt: يوجد تطبيق بالفعل في {destination}. هل تريد استبداله وإعادة التشغيل من Applications؟
  movePrompt: لبدء خدمة الخلفية بأمان، يجب نقل التطبيق إلى {destination}. هل تريد نقله وإعادة تشغيله الآن؟
  createApplicationsDirError: 'تعذر إنشاء مجلد Applications: {error}'
  moveFailed: فشل نقل التطبيق. انقله يدوياً في Finder وحاول مرة أخرى.
  replaceFailed: 'تعذر استبدال التطبيق الحالي بأمان: {error}'
  relaunchFailed: تم نسخ التطبيق، لكن تعذر إعادة تشغيله تلقائياً. افتحه يدوياً من Applications.
