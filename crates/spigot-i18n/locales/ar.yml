_version: 1
notifications:
  dashboardToggled:
    title: لوحة التحكم
    body: تم تحديث حالة ظهور لوحة التحكم.
  clashModeChanged:
    title: تبديل الوضع
    body: تم التبديل إلى {mode}.
  systemProxyToggled:
    title: وكيل النظام
    'on': تم تفعيل وكيل النظام.
    'off': تم تعطيل وكيل النظام.
  systemProxyFailed:
    title: وكيل النظام
    body: تعذر تعيين وكيل النظام. افتح Clash Verge لمعرفة السبب.
  systemProxyGuardStopped:
    title: حارس وكيل النظام
    body: توقف الحارس بعد عدة محاولات فاشلة. افتح Clash Verge لمعرفة السبب.
  tunModeToggled:
    title: وضع TUN
    'on': تم تفعيل وضع TUN.
    'off': تم تعطيل وضع TUN.
  lightweightModeEntered:
    title: الوضع الخفيف
    body: تم الدخول إلى الوضع الخفيف.
  profilesReactivated:
    title: الملفات الشخصية
    body: تم إعادة تفعيل الملف الشخصي.
  appQuit:
    title: على وشك الخروج
    body: Clash Verge على وشك الخروج.
  appHidden:
    title: التطبيق مخفي
    body: Clash Verge يعمل في الخلفية.
  updateReady:
    title: تحديث Clash Verge
    body: تم تنزيل إصدار جديد (v{version}) وهو جاهز للتثبيت.
    installNow: تثبيت الآن
    later: لاحقاً
service:
  adminInstallPrompt: يتطلب تثبيت خدمة Clash Verge صلاحيات المسؤول.
  adminUninstallPrompt: يتطلب إلغاء تثبيت خدمة Clash Verge صلاحيات المسؤول.
