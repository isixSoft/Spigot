    title: Modo TUN
    'on': El modo TUN se ha activado.
    'off': El modo TUN se ha desactivado.
  lightweightModeEntered:
    title: Modo ligero
    body: Se ha entrado en modo ligero.
  profilesReactivated:
    title: Perfiles
    body: Perfil reactivado.
  appQuit:
    title: A punto de salir
    body: Clash Verge está a punto de salir.
  appHidden:
    title: Aplicación oculta
    body: Clash Verge se está ejecutando en segundo plano.
  updateReady:
    title: Actualización de Clash Verge
    body: Se ha descargado una nueva versión (v{version}) y está lista para instalar.
    installNow: Instalar ahora
    later: Más tarde
service:
  adminInstallPrompt: La instalación del servicio Clash Verge requiere privilegios de administrador.
