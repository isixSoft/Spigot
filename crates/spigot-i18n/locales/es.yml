    title: Proxy del sistema
    body: No se pudo configurar el proxy del sistema. Abra Clash Verge para ver el motivo.
  systemProxyGuardStopped:
    title: Guardián del proxy del sistema
    body: El guardián se detuvo tras varios fallos. Abra Clash Verge para ver el motivo.
