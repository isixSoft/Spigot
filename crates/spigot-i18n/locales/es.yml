_version: 1
notifications:
  dashboardToggled:
    title: Panel
    body: La visibilidad del panel se ha actualizado.
  clashModeChanged:
    title: Cambio de modo
    body: Cambiado a {mode}.
  systemProxyToggled:
    title: Proxy del sistema
    'on': El proxy del sistema se ha activado.
    'off': El proxy del sistema se ha desactivado.
